<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lefty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="shell">
    <header class="top">
      <div class="brand-block">
        <p class="brand">Lefty</p>
        <p class="tagline">A tool to find product matches, compare prices, and see what fits your budget.</p>
      </div>
    </header>

    <section class="chat" aria-label="Chat">
      <div class="thread" id="thread"></div>

      <form class="composer" id="form">
        <label class="sr-only" for="message">Message</label>
        <textarea
          id="message"
          rows="1"
          placeholder="e.g. Sony XM5 headphones under $450 CAD"
          autocomplete="off"
          required
        ></textarea>
        <button type="submit" id="send" aria-label="Send">
          <span>Send</span>
        </button>
      </form>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
