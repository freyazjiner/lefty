[project]
name = "lefty"
version = "0.2.0"
description = "Lefty — small shopping agent (catalog search + budget compare)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "openai>=1.54.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "tenacity>=8.5.0",
  "sqlalchemy>=2.0.36",
  "langgraph>=0.2.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
  "numpy>=1.26.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
